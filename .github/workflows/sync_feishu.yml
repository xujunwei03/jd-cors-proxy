name: 同步飞书宴席数据
on:
  # 北京时间每小时整点自动执行
  schedule:
    - cron: '0 1-23/1 * * *'
  # 支持页面手动点击运行测试
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync_job:
    runs-on: ubuntu-latest
    env:
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      BITABLE_APP_TOKEN: ${{ secrets.BITABLE_APP_TOKEN }}
      BITABLE_TABLE_ID: ${{ secrets.BITABLE_TABLE_ID }}
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖requests
        run: pip install requests

      - name: 执行飞书多维表导出脚本
        run: python feishu_sync.py

      - name: 配置git提交身份
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 提交变更推送回仓库
        run: |
          git add feishu_data.json
          git diff --quiet && echo "无数据变更，跳过提交" || git commit -m "auto sync feishu bitable data"
          git push
