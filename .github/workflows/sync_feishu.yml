name: sync feishu and deploy pages
on:
  workflow_dispatch: # 支持手动点按钮触发
  schedule:
    - cron: '0 * * * *' # 每小时执行一次，和你之前需求一致

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout source code(main分支源码)
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install python deps
        run: |
          pip install requests

      - name: run feishu sync script
        env:
          # 把secrets传给脚本环境变量，脚本从环境变量读取token，不要硬编码写脚本文件
          PERSONAL_FINE_GRAINED_TOKEN: ${{ secrets.PERSONAL_FINE_GRAINED_TOKEN }}
        run: python feishu_sync.py
        # ⚠️你的 feishu_sync.py 需要改成从环境变量读取token，不要写死在py源码！
        # 示例py读取代码：import os; token = os.getenv("PERSONAL_FINE_GRAINED_TOKEN")

      # 上面执行完，当前目录已经产出 feishu_data.json
      # 使用官方pages部署action，把 index.html + feishu_data.json 发布到gh‑pages分支
      - name: deploy to github pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./ # 当前目录全部文件(html+json)输出到gh‑pages
