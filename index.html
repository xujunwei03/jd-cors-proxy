<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>宴席农历日历</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif;}
:root{
  --bg:#ffffff;
  --text:#222;
  --card:#f7f7f7;
  --border:#ddd;
  --today-bg:#e8f4ff;
  --active-bg:#cce5ff;
  --has-ev:#fff2cc;
  --star-wang:#ffdddd;  /*星旺日 红色系*/
  --star-ji:#ffe8cc;    /*星吉日 橙色系*/
  --star-hao:#e9ddff;   /*星好日 紫色系*/
  --star-yi:#ddffdd;    /*星宜日 绿色系*/
}
html[data-theme="dark"]{
  --bg:#1a1a1a;
  --text:#eee;
  --card:#2a2a2a;
  --border:#444;
  --today-bg:#203040;
  --active-bg:#254060;
  --has-ev:#443820;
  --star-wang:#4b2222;  /*星旺日 深色模式红色*/
  --star-ji:#4b3822;    /*星吉日 深色模式橙色*/
  --star-hao:#382b4b;   /*星好日 深色模式紫色*/
  --star-yi:#224022;    /*星宜日 深色模式绿色*/
}
body{background:var(--bg);color:var(--text);padding:8px;max-width:1200px;margin:0 auto;}

/* 头部控制栏布局 */
.header-wrap{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  margin-bottom:8px;
}
#ym{font-size:22px;font-weight:bold;text-align:center;}
.icon-btn{
  width:34px;
  height:34px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:6px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  user-select:none;
}
.ctrl-bar{display:flex;gap:6px;justify-content:center;margin-bottom:8px;flex-wrap:wrap;}
button{padding:5px 10px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:4px;cursor:pointer;font-size:14px;}
button.active{background:#2b7cd3;color:#fff;border-color:#2b7cd3;}

#shopFilterBar{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  justify-content:center;
  margin-bottom:8px;
}

/* ========== 新增宴会厅多选下拉样式 ========== */
.hall-filter-wrap{
  position:relative;
  display:inline-block;
  margin:0 4px 8px;
}
#hallSelectBtn{
  padding:5px 10px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:4px;
  cursor:pointer;
  font-size:14px;
  min-width:140px;
}
.hall-dropdown{
  position:absolute;
  top:100%;
  left:0;
  z-index:99;
  border:1px solid var(--border);
  background:var(--bg);
  max-height:260px;
  overflow-y:auto;
  min-width:220px;
  border-radius:4px;
  display:none;
}
.hall-dropdown.show{
  display:block;
}
.hall-item{
  padding:4px 8px;
  font-size:13px;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:6px;
}
.hall-item:hover{
  background:var(--card);
}
.hall-empty-text{
  font-size:10px;
  color:#888;
  line-height:1.1;
}

/* 修改为5列，冻结1‑4（日一二三四），隐藏周五、周六 */
#calendar{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;touch-action:pan-y;}
/*星期头部 只保留5列：日、一、二、三、四 */
.week-header{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:3px;
  margin-bottom:4px;
}
.week-header>div{
  text-align:center;
  font-size:13px;
  font-weight:bold;
  padding:4px 0;
  background:var(--card);
  border-radius:4px;
  border:1px solid var(--border);
}

.day-item{position:relative;border:1px solid var(--border);min-height:82px;padding:3px;border-radius:4px;background:var(--card);overflow:hidden;}
.day-item.empty{background:transparent;border:none;}
.day-item.today{background:var(--today-bg);}
.day-item.active{background:var(--active-bg);}
.day-item.has-ev{background:var(--has-ev);}
.day-item.star-wang{background:var(--star-wang);}
.day-item.star-ji{background:var(--star-ji);}
.day-item.star-hao{background:var(--star-hao);}
.day-item.star-yi{background:var(--star-yi);}

.solar{font-size:16px;font-weight:bold;position:relative;line-height:1.1;}
/* 今日星星放在左下角 */
.today-mark{
  position:absolute;
  left:2px;
  bottom:2px;
  color:#ff3333;
  font-size:14px;
}
.lunar{font-size:10px;opacity:0.85;line-height:1.1;}
.festival,.lunar-festival,.solar-term{font-size:11px;color:#d03030;line-height:1.1;}
.star-tag{font-size:11px;color:#0066aa;font-weight:bold;line-height:1.1;}
.ev-badge{position:absolute;top:1px;right:1px;background:#d92121;color:#fff;border-radius:99px;font-size:10px;padding:0 3px;min-width:14px;text-align:center;line-height:1.2;}

#infoCard{margin-top:12px;padding:10px;border:1px solid var(--border);border-radius:6px;background:var(--card);display:none;}
.detail-item{border-top:1px solid var(--border);padding:6px 0;font-size:13px;line-height:1.5;}
.status-line{margin:4px 0;font-size:12px;line-height:1.3;}

/*手机小屏幕进一步压缩*/
@media (max-width:480px){
  body{padding:4px;}
  #ym{font-size:18px;margin-bottom:0;}
  .icon-btn{width:30px;height:30px;font-size:16px;}
  .ctrl-bar button{padding:4px 7px;font-size:13px;}
  #calendar{gap:2px;}
  .week-header{gap:2px;margin-bottom:3px;}
  .week-header>div{font-size:11px;padding:3px 0;}
  .day-item{min-height:66px;padding:2px;}
  .solar{font-size:14px;}
  .lunar{font-size:9px;}
  .festival,.lunar-festival,.solar-term,.star-tag{font-size:9px;}
  .ev-badge{font-size:9px;min-width:12px;}
  .status-line{font-size:11px;}
  #shopFilterBar button{font-size:12px;padding:3px 6px;}
  .hall-dropdown{min-width:180px;}
  .hall-empty-text{font-size:9px;}
}
</style>
</head>
<body>

<div class="header-wrap">
  <div class="icon-btn" id="prev">◀</div>
  <div id="ym"></div>

</div>
<div class="ctrl-bar">
  <button id="refresh">刷新数据</button>
  <button id="themeBtn">切换深色</button>
</div>
<div id="shopFilterBar"></div>

<!-- ========== 新增宴会厅多选下拉UI ========== -->
<div class="hall-filter-wrap">
  <button id="hallSelectBtn">选择宴会厅 ▾</button>
  <div class="hall-dropdown" id="hallDropdown"></div>

<div class="status-line" id="lunarLoadStatus"></div>

let currentShopFilter = null; // 当前选中门店 null=全部

let loading = false;

// ========== 农历中文映射（备用，若star.xlsx农历列是数字则用此转换）==========
const lunarMonthCn = ["正","二","三","四","五","六","七","八","九","十","冬","腊"];
const lunarDayCn = [
    "","初一","初二","初三","初四","初五","初六","初七","初八","初九","初十",
    "十一","十二","十三","十四","十五","十六","十七","十八","十九","二十",

/**
 * 格式化农历显示：
 * - 如果star.xlsx农历列已经是"七月初二"这种文本，直接返回
 * - 如果是数字或对象，做兼容处理
 */
function formatLunarDisplay(rawVal){
  if(rawVal === null || rawVal === undefined || rawVal === "") return "--";
  // 已经是字符串，直接展示
  if(typeof rawVal === "string") return rawVal.trim();
  // 对象格式 {lunarMonthStr,lunarDayStr,isLeap} 兼容
  if(typeof rawVal === "object"){
    const leapTxt = rawVal.isLeap ? "闰" : "";
    return `${leapTxt}${rawVal.lunarMonthStr || ""}${rawVal.lunarDayStr || ""}`;
  }
  return String(rawVal);
}

// ========== 本地缓存工具 ==========
function saveEventCache(list){
  try{
    localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify({
      updateTime: Date.now(),
      data: list
    }));
  }catch(e){
    console.warn("浏览器阻止localStorage写入",e);
  }
}

function readEventCache(){
  try{
    const str = localStorage.getItem(LOCAL_STORAGE_KEY);
    if(!str) return null;
    return JSON.parse(str);
  }catch(e){
    console.warn("浏览器阻止localStorage读取",e);
    return null;
  }
}

function isCacheExpired(cacheObj){
  return Date.now() - cacheObj.updateTime > CACHE_TTL;
}

// 根据筛选门店+宴会厅过滤数据
function applyShopFilter(){
  let tempList;
  if(currentShopFilter === null){
    tempList = [...fullOriginEventList];
  }else{
    tempList = fullOriginEventList.filter(item=>item.shop === currentShopFilter);
  }
  // 叠加宴会厅筛选
  if(selectedHallList.length > 0){
    tempList = tempList.filter(item => selectedHallList.includes(item.hall));
  }
  fullEventList = tempList;
}

function getMonthEventFromCache(y,m){
  const start = `${y}-${String(m).padStart(2,"0")}-01`;
  const end = `${y}-${String(m).padStart(2,"0")}-${new Date(y,m,0).getDate()}`;
  return fullEventList.filter(item => item.date >= start && item.date <= end);
}

// 动态渲染门店筛选按钮
function renderShopFilterButtons(){
  const bar = document.getElementById("shopFilterBar");
  bar.innerHTML = "";
  // 获取所有不重复门店，过滤空
  const shopSet = new Set();
  fullOriginEventList.forEach(i=>{
    if(i.shop && String(i.shop).trim()!=='') shopSet.add(i.shop);
  });
  const shopList = Array.from(shopSet).sort();

  // 全部按钮
  const btnAll = document.createElement("button");
  btnAll.textContent = "全部门店";
  if(currentShopFilter===null) btnAll.classList.add("active");
  btnAll.onclick = ()=>{
    currentShopFilter = null;
    selectedHallList = []; //切换门店清空宴会厅选择
    applyShopFilter();
    renderShopFilterButtons();
    renderHallDropdown();
    renderCalendar();
  };
  bar.appendChild(btnAll);

  shopList.forEach(shopName=>{
    const btn = document.createElement("button");
    btn.textContent = shopName;
    if(currentShopFilter === shopName) btn.classList.add("active");
    btn.onclick = ()=>{
      currentShopFilter = shopName;
      selectedHallList = []; //切换门店清空宴会厅选择
      applyShopFilter();
      renderShopFilterButtons();
      renderHallDropdown();
      renderCalendar();
    };
    bar.appendChild(btn);
  });
}

// ========== 渲染宴会厅多选下拉框 ==========
function renderHallDropdown(){
  const dropdown = document.getElementById("hallDropdown");
  const btn = document.getElementById("hallSelectBtn");
  dropdown.innerHTML = "";

  // ============【修改点】全部门店时收集全部宴会厅；选门店只取该门店 ============
  let hallOptions = [];
  if(currentShopFilter === null){
    //全部门店：把所有门店的厅全部合并，去重
    const allHallsSet = new Set();
    Object.values(SHOP_TO_HALL_MAP).forEach(hallArr=>{
      hallArr.forEach(h=>allHallsSet.add(h));
    });
    hallOptions = Array.from(allHallsSet);
  }else{
    //指定门店，取该门店厅
    if(SHOP_TO_HALL_MAP[currentShopFilter]){
      hallOptions = SHOP_TO_HALL_MAP[currentShopFilter];
    }
  }

  // 全选按钮
  const selectAllDiv = document.createElement("div");
  selectAllDiv.className = "hall-item";
  selectAllDiv.innerHTML = `<input type="checkbox"> <span>【全选】</span>`;
  selectAllDiv.onclick = (e)=>{
    e.stopPropagation();
    selectedHallList = [...hallOptions];
    renderHallDropdown();
    applyShopFilter();
    renderCalendar();
  };
  dropdown.appendChild(selectAllDiv);

  // 清空全部按钮
  const clearAllDiv = document.createElement("div");
  clearAllDiv.className = "hall-item";
  clearAllDiv.innerHTML = `<input type="checkbox"> <span>【清空全部选择】</span>`;
  clearAllDiv.onclick = (e)=>{
    e.stopPropagation();
    selectedHallList = [];
    renderHallDropdown();
    applyShopFilter();
    renderCalendar();
  };
  dropdown.appendChild(clearAllDiv);

  hallOptions.forEach(hallName=>{
    const div = document.createElement("div");
    div.className = "hall-item";
    const checked = selectedHallList.includes(hallName);
    div.innerHTML = `<input type="checkbox" ${checked?"checked":""}> <span>${hallName}</span>`;
    div.onclick = (ev)=>{
      ev.stopPropagation();
      const idx = selectedHallList.indexOf(hallName);
      if(idx > -1){
        selectedHallList.splice(idx,1);
      }else{
        selectedHallList.push(hallName);
      }
      renderHallDropdown();
      applyShopFilter();
      renderCalendar();
    };
    dropdown.appendChild(div);
  });

  // 更新按钮文字
  if(selectedHallList.length ===0){
    btn.innerText = "选择宴会厅 ▾";
  }else{
    btn.innerText = `已选${selectedHallList.length}个厅 ▾`;
  }
}

// ========== 星日期Excel（同时读取农历列）==========
async function loadStarExcel() {
  const statusEl = document.getElementById("starStatus");
  const lunarStatusEl = document.getElementById("lunarLoadStatus");
  try {
    const resp = await fetch(STAR_EXCEL_CONFIG.url);
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const buf = await resp.arrayBuffer();
    const wb = XLSX.read(buf, { type: "array", cellDates: true });
    const sheetName = STAR_EXCEL_CONFIG.sheetName || wb.SheetNames[0];
    const sheet = wb.Sheets[sheetName];
    if (!sheet) throw new Error("找不到工作表：" + sheetName);
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false });
    const starMap = {};
    const lunarMap = {};
    const startIdx = STAR_EXCEL_CONFIG.skipHeader ? 1 : 0;
    for (let i = startIdx; i < rows.length; i++) {
      const row = rows[i];
      if (!row || row.length === 0) continue;
      let dateVal = row[STAR_EXCEL_CONFIG.dateColumn];
      const starVal = (row[STAR_EXCEL_CONFIG.starColumn] || "").toString().trim();
      const lunarVal = row[STAR_EXCEL_CONFIG.lunarColumn];
      if (!dateVal) continue;
      let dateStr;
      if (dateVal instanceof Date) {
        dateStr = dateVal.getFullYear() + "-" + String(dateVal.getMonth() + 1).padStart(2, "0") + "-" + String(dateVal.getDate()).padStart(2, "0");
      } else {
        dateVal = dateVal.toString().trim();
        const parts = dateVal.split(/[\/\-]/);
        if (parts.length === 3) {
          dateStr = parts[0] + "-" + String(parts[1]).padStart(2, "0") + "-" + String(parts[2]).padStart(2, "0");
        } else {
          continue;
        }
      }
      if (starVal) starMap[dateStr] = starVal;
      if (lunarVal !== undefined && lunarVal !== null && lunarVal !== "") {
        lunarMap[dateStr] = lunarVal;
      }
    }
    starDateMap = starMap;
    starLunarMap = lunarMap;

    if(statusEl){
      statusEl.innerText = `星日期已加载（${Object.keys(starMap).length}条）`;
      statusEl.style.color = "#0e9f6e";
    }
    if(lunarStatusEl){
      lunarStatusEl.innerText = `✅农历数据已从star.xlsx载入，共${Object.keys(lunarMap).length}条`;
      lunarStatusEl.style.color = "#0e9f6e";
    }
    return true;
  } catch (e) {
    console.error("星日期Excel加载失败：", e);
    if(statusEl){
      statusEl.innerText = "星日期加载失败（不影响其他功能）";
      statusEl.style.color = "#d92121";
    }
    if(lunarStatusEl){
      lunarStatusEl.innerText = "❌农历加载失败，请确认star.xlsx农历列配置";
      lunarStatusEl.style.color = "#d92121";
    }
    return false;
  }
}

// ========== 宴席数据 ==========
async function loadFeishuJson(forceRefresh = false){
  if(loading) return;
  loading = true;
  const loadStatus = document.getElementById("loadStatus");
  const cacheInfo = document.getElementById("cacheInfo");
  try{
    if(forceRefresh){
      if(loadStatus) loadStatus.innerText = "正在读取feishu_data.json宴席数据...";
    }
    const resp = await fetch(FESHU_JSON_URL, { cache: forceRefresh ? "no-cache" : "default" });
    if(!resp.ok) throw new Error(`文件读取失败 ${resp.status}，确认feishu_data.json和index.html放在同一目录`);
    const rawArr = await resp.json();
    const formatList = rawArr.map(item => {
      return {
        date: item["宴会日期"] || "",
        hall: item["宴会厅"] || "",
        shop: item["门店"] || "",
        customer: item["客户|宴会主题"] || "",
        table: item["桌数"] || "",
        sales: item["销售负责人"] || "",
        title: item["预定情况"] || ""
      }
    }).filter(item => !!item.date);

    fullOriginEventList = formatList;
    applyShopFilter();
    saveEventCache(fullOriginEventList);
    const time = new Date().toLocaleString();
    if(cacheInfo){
      cacheInfo.innerText = `缓存更新:${time}`;
      cacheInfo.style.color = "#0e9f6e";
    }
    renderShopFilterButtons();
    renderHallDropdown();
    renderCalendar();
    if(loadStatus) loadStatus.innerText = `✅已同步全部宴席${fullOriginEventList.length}条`;
  }catch(err){
    if(!forceRefresh){
      if(loadStatus) loadStatus.innerText = "网络更新失败，继续使用本地缓存";
    }else{
      alert("读取feishu_data.json失败：" + err.message);
      if(loadStatus) loadStatus.innerText = "❌读取json失败";
    }
    console.error(err);
  }finally{
    loading = false;
  }
}

// ========== 节日读取 ==========
function getSolarFestival(y,m,d){
  const k = `${m}-${d}`;
  return SOLAR_FESTIVAL[k] || "";
}

function getLunarFestival(lunarText){
  if(!lunarText) return "";
  const found = LUNAR_FESTIVAL_MAP.find(f => lunarText.includes(f.key));
  return found ? found.name : "";
}

function getSolarTerm(y,m,d){
  const dateStr = `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  return SOLAR_TERM[dateStr] || "";
}

// ========== 日历渲染 ==========
let currentYear, currentMonth;
let selectItem = null;
const $ = s => document.querySelector(s);
const calendarEl = $("#calendar");
const ymEl = $("#ym");
const infoCard = $("#infoCard");
const infoText = $("#infoText");


async function init(){
  const now = new Date();
  currentYear = now.getFullYear();
  currentMonth = now.getMonth() + 1;

  // 尝试读取本地缓存
  const cache = readEventCache();
  if(cache && !isCacheExpired(cache)){
    fullOriginEventList = cache.data;
    applyShopFilter();
    renderShopFilterButtons();
    renderHallDropdown();
  }

  // 并行加载星Excel 和宴席json
  await Promise.all([
    loadStarExcel(),
    loadFeishuJson(false)
  ]);

  renderCalendar();

  // 绑定按钮事件
  $("#prev").onclick = ()=>{
    currentMonth--;
    if(currentMonth < 1){
      currentMonth = 12;
      currentYear--;
    }
    renderCalendar();
  }
  $("#next").onclick = ()=>{
    currentMonth++;
    if(currentMonth >12){
      currentMonth =1;
      currentYear++;
    }
    renderCalendar();
  }

  $("#refresh").onclick = ()=> loadFeishuJson(true);

  $("#themeBtn").onclick = ()=>{
    const html = document.documentElement;
    if(html.dataset.theme === "dark"){
      delete html.dataset.theme;
      $("#themeBtn").innerText = "切换深色";
    }else{
      html.dataset.theme = "dark";
      $("#themeBtn").innerText = "切换浅色";
    }
  }

  //宴会厅下拉点击开关
  const hallBtn = $("#hallSelectBtn");
  const hallDrop = $("#hallDropdown");
  hallBtn.onclick = (e)=>{
    e.stopPropagation();
    hallDrop.classList.toggle("show");
  }
  //点击页面外部关闭下拉
  document.addEventListener("click",()=>{
    hallDrop.classList.remove("show");
  })
}


function renderCalendar(){
  ymEl.innerText = `${currentYear}年${currentMonth}月`;
  calendarEl.innerHTML = "";
  const firstDay = new Date(currentYear, currentMonth-1, 1);
  const lastDay = new Date(currentYear, currentMonth, 0);
  const totalDays = lastDay.getDate();
  // 本周第一天：周日=0，我们只显示【日 一 二 三 四】5列，周五(5)周六(6)直接跳过
  let startWeekDay = firstDay.getDay(); //0周日,1周一...4周四,5周五,6周六

  //填充前面空白格子
  for(let i=0;i<startWeekDay;i++){
    const emptyDiv = document.createElement("div");
    emptyDiv.className = "day-item empty";
    calendarEl.appendChild(emptyDiv);
  }

  const monthEvents = getMonthEventFromCache(currentYear, currentMonth);
  const todayObj = new Date();
  const todayY = todayObj.getFullYear();
  const todayM = todayObj.getMonth()+1;
  const todayD = todayObj.getDate();

  for(let d=1;d<=totalDays;d++){
    const dateObj = new Date(currentYear,currentMonth-1,d);
    const wd = dateObj.getDay();
    // 周五5、周六6直接跳过不渲染
    if(wd ===5 || wd ===6) continue;

    const dateStr = `${currentYear}-${String(currentMonth).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const dayDiv = document.createElement("div");
    dayDiv.className = "day-item";

    //今日标记
    if(currentYear === todayY && currentMonth === todayM && d === todayD){
      dayDiv.classList.add("today");
    }

    //星类型样式
    const starType = starDateMap[dateStr] || "";
    if(starType === "旺") dayDiv.classList.add("star-wang");
    if(starType === "吉") dayDiv.classList.add("star-ji");
    if(starType === "好") dayDiv.classList.add("star-hao");
    if(starType === "宜") dayDiv.classList.add("star-yi");

    //农历文本
    const lunarTxt = formatLunarDisplay(starLunarMap[dateStr]);
    //节日
    const solarFest = getSolarFestival(currentYear,currentMonth,d);
    const lunarFest = getLunarFestival(lunarTxt);
    const termTxt = getSolarTerm(currentYear,currentMonth,d);

    //当日事件
    const dayEvts = monthEvents.filter(ev=> ev.date === dateStr);
    if(dayEvts.length>0) dayDiv.classList.add("has-ev");

    dayDiv.innerHTML =`
      <div class="solar">${d}</div>
      <div class="lunar">${lunarTxt}</div>
      ${solarFest?`<div class="festival">${solarFest}</div>`:""}
      ${lunarFest?`<div class="lunar-festival">${lunarFest}</div>`:""}
      ${termTxt?`<div class="solar-term">${termTxt}</div>`:""}
      ${starType?`<div class="star-tag">星${starType}</div>`:""}
      ${dayEvts.length>0?`<div class="ev-badge">${dayEvts.length}</div>`:""}
    `;

    //点击日期弹窗详情
    dayDiv.onclick = ()=>{
      selectItem = dateStr;
      infoCard.style.display = "block";
      let htmlText = `<div><b>${dateStr} ${lunarTxt}</b></div>`;
      if(dayEvts.length ===0){
        htmlText += `<div>今日无宴席预定</div>`
      }else{
        dayEvts.forEach(evt=>{
          htmlText += `<div class="detail-item">🏨${evt.shop}｜${evt.hall}<br/>👤${evt.customer}｜桌数:${evt.table}<br/>📝${evt.title}｜销售:${evt.sales}</div>`
        })
      }
      infoText.innerHTML = htmlText;
    }
    calendarEl.appendChild(dayDiv);
  }
}

//页面加载启动
window.addEventListener("DOMContentLoaded",init);
</script>
</body>
</html>
